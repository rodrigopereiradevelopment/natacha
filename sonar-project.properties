# Configuração do SonarQube Cloud (SonarCloud) para a Natacha
# Documentação: https://docs.sonarsource.com/sonarqube-cloud/

sonar.projectKey=rodrigopereiradevelopment_natacha
sonar.organization=rodrigopereiradevelopment
sonar.projectName=Natacha

# Código-fonte analisado
sonar.sources=src,include
sonar.tests=tests

# O Sonar não compila C++ sozinho: ele lê o banco de compilação gerado pelo CMake.
# O workflow do GitHub Actions gera este arquivo antes da análise.
sonar.cfamily.compile-commands=build/compile_commands.json

sonar.sourceEncoding=UTF-8

# Código de terceiros e artefatos que não devem poluir as métricas
sonar.exclusions=src/embeddings/json.hpp,src/**/backup/**,src/**/*.py,src/**/*.txt,src/**/*.bin
